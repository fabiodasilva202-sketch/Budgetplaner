<style>
  :root{
    --paper:#F2F4F1; --ink:#1B2533; --muted:#5E6875; --line:#DDE1DA; --card:#fff;
    --fix:#2F5D8C; --var:#C9962B; --save:#3E7D52; --rest:#9AA3AD; --alarm:#B8322A;
    --c:var(--ink);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;
    font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;
    display:flex;flex-direction:column;max-width:560px;margin:0 auto}
  button{font:inherit;color:inherit}
  button:focus-visible{outline:2px solid #6C9BCB;outline-offset:2px}

  /* Kopf */
  .top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;
    padding:calc(12px + env(safe-area-inset-top)) 18px 14px}
  .month{display:flex;justify-content:space-between;align-items:center;gap:10px;
    margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.15)}
  .cal-btn{display:flex;align-items:center;gap:8px;background:none;border:none;padding:6px 0;color:#fff;min-height:40px}
  .cal-btn svg{flex:none}
  #month{font-weight:700;font-size:1.05rem}
  .cal-btn .chev{opacity:.6;font-size:.8rem}
  .save-btn{min-height:38px;padding:0 16px;border-radius:19px;border:1px solid rgba(255,255,255,.35);
    background:transparent;color:rgba(255,255,255,.75);font-size:.9rem;font-weight:600;white-space:nowrap}
  .save-btn.dirty{background:#fff;color:var(--ink);border-color:#fff}
  .top small{display:block;font-size:.8rem;opacity:.7}
  .top-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  .rest{font-size:1.9rem;font-weight:700;line-height:1.1;letter-spacing:-.01em}
  .rest.neg{color:#FF9B93}
  .inc{text-align:right;font-weight:600}
  .strip{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:12px;background:rgba(255,255,255,.15)}
  .strip div{height:100%;transition:width .3s ease}
  .s-fix{background:#6C9BCB}.s-var{background:var(--var)}.s-save{background:#6DB585}.s-rest{background:var(--rest)}

  main{flex:1;padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
  .sec-head{display:flex;justify-content:space-between;align-items:baseline;margin:4px 4px 12px}
  .sec-head h1{font-size:1.35rem;margin:0}
  .sec-head span{font-weight:700;color:var(--c)}
  .sec-head p{margin:2px 0 0;color:var(--muted);font-size:.85rem}

  .item{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;border-left:5px solid var(--c);
    display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
  .item .name{grid-column:1/2;font:inherit;font-size:.92rem;color:var(--muted);border:none;background:none;padding:2px 0;width:100%}
  .item .del{grid-column:2/3;grid-row:1/2;border:none;background:none;color:var(--muted);font-size:1.4rem;width:40px;height:32px;line-height:1;margin-right:-8px}
  .amt-wrap{grid-column:1/3;display:flex;align-items:baseline;gap:8px}
  .amt{font:inherit;font-size:1.5rem;font-weight:600;border:none;background:none;width:100%;padding:2px 0;color:var(--ink)}
  .cur{color:var(--muted);font-size:.9rem}
  .pct{color:var(--muted);font-size:.85rem;white-space:nowrap}
  input:focus{outline:none}
  .item:focus-within{box-shadow:0 0 0 2px var(--c)}
  .add{width:100%;min-height:52px;border:2px dashed var(--line);border-radius:12px;background:none;color:var(--muted);font-weight:500}

  .card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px}
  .card h2{font-size:1.05rem;margin:0 0 10px}
  .line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #EEF0EC}
  .line:last-child{border-bottom:none}
  .line.total{border-top:2px solid var(--ink);border-bottom:none;font-weight:700;font-size:1.1rem;margin-top:4px;padding-top:12px}
  .line b{font-weight:600}
  .neg{color:var(--alarm)}
  .ok{color:var(--save)}.warn{color:#9A6F12}.bad{color:var(--alarm)}
  ul{margin:0;padding-left:18px} li{margin-bottom:10px}
  .tools{display:flex;gap:10px}
  .tools button{flex:1;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
  .hint{font-size:.82rem;color:var(--muted);margin:8px 0 0}

  /* Verlauf */
  .hist{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid #EEF0EC;padding:10px 0}
  .hist:last-child{border-bottom:none}
  .hist-top{display:flex;justify-content:space-between;font-size:.95rem}
  .hist-top b{font-weight:600}
  .hist.cur .hist-top span:first-child{font-weight:700}
  .mini{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px;background:#E7EAE5}
  .mini div{height:100%}
  .mf{background:var(--fix)}.mv{background:var(--var)}.ms{background:var(--save)}

  /* Monatsauswahl */
  .sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(27,37,51,.45);display:none;align-items:flex-end;justify-content:center}
  .sheet-bg.open{display:flex}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .sheet-head h2{margin:0;font-size:1.1rem}
  .x{border:none;background:none;font-size:1.6rem;line-height:1;width:44px;height:44px;margin-right:-10px;color:var(--muted)}
  .year{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .year b{font-size:1.2rem}
  .year button{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:none;font-size:1.2rem}
  .months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .m{position:relative;min-height:56px;border-radius:10px;border:1px solid var(--line);background:none;font-weight:500}
  .m.today{border:2px solid var(--ink)}
  .m.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
  .m.saved::after{content:"";position:absolute;left:50%;bottom:7px;width:6px;height:6px;margin-left:-3px;border-radius:3px;background:var(--save)}
  .m.sel.saved::after{background:#6DB585}
  .sheet-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:.82rem;color:var(--muted)}
  .sheet-foot i{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--save);margin-right:6px;vertical-align:middle}
  .sheet-foot button{border:1px solid var(--line);background:none;border-radius:10px;min-height:40px;padding:0 14px;color:var(--ink)}

  .choice{display:flex;flex-direction:column;gap:10px}
  .choice button{min-height:56px;border-radius:12px;border:1px solid var(--line);background:none;text-align:left;padding:10px 16px}
  .choice button small{display:block;color:var(--muted);font-size:.82rem}
  .choice button:first-child{background:var(--ink);color:#fff;border-color:var(--ink)}
  .choice button:first-child small{color:rgba(255,255,255,.7)}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
    display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
  nav .in{display:flex;width:100%;max-width:560px}
  nav button{flex:1;border:none;background:none;font-size:.72rem;color:var(--muted);
    padding:8px 2px 10px;min-height:62px;display:flex;flex-direction:column;align-items:center;gap:4px}
  nav button i{display:block;width:26px;height:6px;border-radius:3px;background:var(--line)}
  nav button[aria-selected="true"]{color:var(--ink);font-weight:600}
  nav button[aria-selected="true"] i{background:var(--dot)}
  .toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;
    background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none;
    max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){.strip div,.toast{transition:none}.sheet{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="month">
    <button class="cal-btn" id="cal" aria-label="Monat wählen">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span id="month"></span><span class="chev">▼</span>
    </button>
    <button class="save-btn" id="saveBtn">Sichern</button>
  </div>
  <div class="top-row">
    <div><small>Unverplanter Rest</small><div class="rest" id="rest"></div></div>
    <div class="inc"><small>Einnahmen</small><span id="inc"></span></div>
  </div>
  <div class="strip" id="strip" aria-hidden="true"></div>
</header>

<main id="view"><noscript><p>Dieses Programm braucht JavaScript. Öffne die Seite bitte in Safari.</p></noscript></main>

<nav aria-label="Bereiche"><div class="in" id="nav"></div></nav>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle">Monat wählen</h2><button class="x" id="sheetClose" aria-label="Schliessen">×</button></div>
    <div class="year">
      <button id="yPrev" aria-label="Vorheriges Jahr">‹</button><b id="yLabel"></b><button id="yNext" aria-label="Nächstes Jahr">›</button>
    </div>
    <div class="months" id="months"></div>
    <div class="sheet-foot"><span><i></i>Gesicherter Monat</span><button id="toToday">Aktueller Monat</button></div>
  </div>
</div>

<div class="sheet-bg" id="sendBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sendTitle">
    <div class="sheet-head"><h2 id="sendTitle">Was möchtest du senden?</h2><button class="x" data-close="sendBg" aria-label="Schliessen">×</button></div>
    <div class="choice">
      <button id="sendOne"></button>
      <button id="sendAll"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
const KEY = "budgetplaner-chf-v2";      // alle Monate
const KEY_OLD = "budgetplaner-chf-v1";  // frühere Version (ein Budget)
const KEY_DRAFT = "budgetplaner-chf-draft";
const SECTIONS = ["income","fix","var","save"];

const TABS = [
  {k:"income", label:"Einnahmen", title:"Einnahmen", color:"var(--ink)", sub:"Netto pro Monat"},
  {k:"fix", label:"Fix", title:"Fixkosten", color:"var(--fix)", sub:"Miete, Krankenkasse, Steuern …"},
  {k:"var", label:"Variabel", title:"Variable Kosten", color:"var(--var)", sub:"Alltag und Freizeit"},
  {k:"save", label:"Sparen", title:"Sparen & Vorsorge", color:"var(--save)", sub:"Säule 3a und Notgroschen"},
  {k:"eval", label:"Auswertung", title:"Auswertung", color:"var(--ink)"}
];

const DEFAULTS = {
  income:[["Hauptgehalt (netto)",0],["13. Monatslohn anteilig / Nebeneinkünfte",0]],
  fix:[["Miete inkl. Nebenkosten",0],["Krankenkasse (Grund + Zusatz)",0],["Versicherungen (Hausrat, Haftpflicht, Auto)",0],["Steuern (Rückstellung)",0],["Mobilität (ÖV/GA, Auto, Benzin)",0],["Abos (Internet, Handy, Streaming)",0],["Sonstige Fixkosten",0]],
  var:[["Lebensmittel & Haushalt",0],["Freizeit, Hobbys & Ausgehen",0],["Kleidung & persönliche Pflege",0],["Unvorhergesehenes / Puffer",0]],
  save:[["Säule 3a",0],["Freies Sparen / Notgroschen",0]]
};

let uid = 0, tab = "income";
let store = {version:2, months:{}};
let current = "", data = null, dirty = false, pickYear = 0;

// ---------- Hilfsfunktionen ----------
const build = s => Object.fromEntries(Object.entries(s).map(([k,a]) => [k, a.map(([name,amount]) => ({id:++uid,name,amount}))]));
const clone = o => JSON.parse(JSON.stringify(o));
const valid = d => d && SECTIONS.every(k => Array.isArray(d[k]));
const fmt = n => (n<0?"−":"") + Math.abs(n).toLocaleString("de-CH",{minimumFractionDigits:2,maximumFractionDigits:2});
const chf = n => fmt(n) + " CHF";
const pct = (n,t) => t>0 ? (n/t*100).toLocaleString("de-CH",{minimumFractionDigits:1,maximumFractionDigits:1})+" %" : "–";
const sumOf = (d,k) => d[k].reduce((s,i)=>s+(Number(i.amount)||0),0);
const sum = k => sumOf(data,k);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const parse = v => { const n = parseFloat(String(v).replace(/[’' ]/g,"").replace(",", ".")); return isNaN(n)?0:n; };
const totalsOf = d => { const inc=sumOf(d,"income"),fix=sumOf(d,"fix"),vr=sumOf(d,"var"),sv=sumOf(d,"save"); return {inc,fix,vr,sv,avail:inc-fix-vr,rest:inc-fix-vr-sv}; };
const totals = () => totalsOf(data);
const zeroed = d => { const c = clone(d); SECTIONS.forEach(k=>c[k].forEach(i=>i.amount=0)); return c; };
const prevSaved = key => Object.keys(store.months).sort().filter(k=>k<key).pop();

const keyOf = (y,m) => y + "-" + String(m+1).padStart(2,"0");
const todayKey = () => { const d=new Date(); return keyOf(d.getFullYear(), d.getMonth()); };
const parseKey = k => { const [y,m]=k.split("-").map(Number); return {y, m:m-1}; };
const labelOf = k => { const {y,m}=parseKey(k); return new Date(y,m,1).toLocaleDateString("de-CH",{month:"long",year:"numeric"}); };
const shortMonth = m => new Date(2000,m,1).toLocaleDateString("de-CH",{month:"short"}).replace(".","");
const fixUid = () => { uid = Math.max(uid, 0, ...Object.values(store.months).concat([data||{}]).flatMap(d=>SECTIONS.flatMap(k=>(d[k]||[]).map(i=>i.id||0)))); };

function toast(msg, ms=1600){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),ms); }

// ---------- Speichern ----------
function writeStore(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); return true; }
  catch(e){ toast("Speichern nicht möglich"); return false; }
}
function writeDraft(){
  try{ localStorage.setItem(KEY_DRAFT, JSON.stringify({month:current, data})); }catch(e){}
}
function clearDraft(){ try{ localStorage.removeItem(KEY_DRAFT); }catch(e){} }

function saveMonth(){
  store.months[current] = clone(data);
  if(writeStore()){ clearDraft(); dirty=false; updateSaveBtn(); toast(labelOf(current) + " gesichert"); }
}
function markDirty(){ dirty = true; writeDraft(); updateSaveBtn(); }
function updateSaveBtn(){
  const b = document.getElementById("saveBtn");
  b.classList.toggle("dirty", dirty);
  b.textContent = dirty ? "Sichern" : "✓ Gesichert";
  b.setAttribute("aria-label", dirty ? "Änderungen sichern" : "Alles gesichert");
}

// Monat öffnen: gesicherte Werte laden, sonst vom letzten Monat davor übernehmen
function openMonth(key){
  current = key;
  if(store.months[key]){ data = clone(store.months[key]); dirty = false; }
  else{
    const keys = Object.keys(store.months).sort();
    const before = keys.filter(k=>k<key).pop() || keys.filter(k=>k>key)[0];
    data = before ? zeroed(store.months[before]) : build(DEFAULTS);
    dirty = false;
  }
  fixUid(); updateSaveBtn(); renderView(); renderTop();
}
function switchMonth(key){
  if(key===current){ closeSheet(); return; }
  if(dirty){
    if(confirm("Änderungen für " + labelOf(current) + " sichern, bevor du wechselst?")) saveMonth();
    else clearDraft();
  }
  closeSheet(); openMonth(key);
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const s=JSON.parse(raw); if(s && s.months) store = s; }
    else{
      const old = localStorage.getItem(KEY_OLD); // Übernahme aus der Vorversion
      if(old){ const d=JSON.parse(old); if(valid(d)){ store.months[todayKey()] = d; writeStore(); } }
    }
    const dr = localStorage.getItem(KEY_DRAFT);
    if(dr){ const d=JSON.parse(dr); if(d && d.month && valid(d.data)){ current=d.month; data=d.data; dirty=true; fixUid(); return true; } }
  }catch(e){}
  return false;
}

// ---------- Anzeige ----------
function renderNav(){
  document.getElementById("nav").innerHTML = TABS.map(t =>
    `<button role="tab" data-tab="${t.k}" aria-selected="${t.k===tab}" style="--dot:${t.color}"><i></i>${t.label}</button>`).join("");
}

function renderView(){
  const t = TABS.find(x=>x.k===tab), v = document.getElementById("view");
  v.style.setProperty("--c", t.color);
  if(tab==="eval"){ renderEval(v); return; }
  const inc = sum("income");
  v.innerHTML = `
    <div class="sec-head"><div><h1>${t.title}</h1><p>${t.sub}</p></div><span id="secSum">${chf(sum(tab))}</span></div>
    ${data[tab].map(i => `
      <div class="item" data-id="${i.id}">
        <input class="name" value="${esc(i.name)}" aria-label="Bezeichnung" data-f="name">
        <button class="del" aria-label="${esc(i.name)} entfernen">×</button>
        <div class="amt-wrap">
          <input class="amt" type="text" inputmode="decimal" value="${i.amount||""}" placeholder="0" aria-label="Betrag in CHF für ${esc(i.name)}" data-f="amount">
          <span class="cur">CHF</span>
          <span class="pct" id="p-${i.id}">${tab==="income"?"":pct(Number(i.amount)||0,inc)}</span>
        </div>
      </div>`).join("")}
    <button class="add" id="add">+ Position hinzufügen</button>`;
}

function renderEval(v){
  const {inc,fix,vr,sv,avail,rest} = totals();
  // Verlauf der gesicherten Monate (neueste zuerst)
  const keys = Object.keys(store.months).sort().reverse().slice(0,24);
  const hist = keys.length ? keys.map(k => {
    const d = k===current ? data : store.months[k], t = totalsOf(d), base = Math.max(t.inc, t.fix+t.vr+t.sv) || 1;
    return `<button class="hist${k===current?" cur":""}" data-month="${k}">
      <div class="hist-top"><span>${labelOf(k)}</span><b class="${t.rest<0?"neg":""}">${chf(t.rest)}</b></div>
      <div class="mini"><div class="mf" style="width:${t.fix/base*100}%"></div><div class="mv" style="width:${t.vr/base*100}%"></div><div class="ms" style="width:${t.sv/base*100}%"></div></div>
    </button>`; }).join("")
    : `<p class="hint" style="margin:0">Noch keine Monate gesichert. Tippe oben auf «Sichern», um ${labelOf(current)} zu speichern.</p>`;
  const totalSaved = keys.reduce((s,k)=>s+totalsOf(k===current?data:store.months[k]).sv,0);

  v.innerHTML = `
    <div class="sec-head"><div><h1>Auswertung</h1><p>${labelOf(current)}</p></div></div>
    <div class="card">
      <h2>Zusammenfassung</h2>
      <div class="line"><span>Total Einnahmen</span><b>${chf(inc)}</b></div>
      <div class="line"><span>− Fixkosten</span><b>${chf(fix)}</b></div>
      <div class="line"><span>− Variable Kosten</span><b>${chf(vr)}</b></div>
      <div class="line"><span>= Verfügbar zum Sparen</span><b class="${avail<0?"neg":""}">${chf(avail)}</b></div>
      <div class="line"><span>− Geplantes Sparen</span><b>${chf(sv)}</b></div>
      <div class="line total"><span>Unverplanter Rest</span><span class="${rest<0?"neg":""}">${chf(rest)}</span></div>
    </div>
    <div class="card"><h2>Verlauf</h2>${hist}
      ${keys.length>1?`<p class="hint">Gespart über diese ${keys.length} Monate: <b>${chf(totalSaved)}</b>. Tippe auf einen Monat, um ihn zu öffnen.</p>`:""}
    </div>
    <div class="tools"><button id="prev">Vormonat übernehmen</button><button id="clear">Alles auf 0</button></div>
    <div class="card" style="margin-top:12px"><h2>Budget teilen</h2>
      <p class="hint" style="margin:0 0 10px">Sende dein Budget per WhatsApp oder iMessage. Wer es bekommt, kopiert die Nachricht und tippt auf «Budget empfangen». Als Sicherung kannst du es auch an dich selbst oder in die Notizen-App senden.</p>
      <div class="tools"><button id="send">Budget senden</button><button id="receive">Budget empfangen</button></div>
    </div>`;
}

function renderTop(){
  document.getElementById("month").textContent = labelOf(current);
  const {inc,fix,vr,sv,rest} = totals();
  const r = document.getElementById("rest");
  r.textContent = chf(rest); r.classList.toggle("neg", rest<0);
  document.getElementById("inc").textContent = chf(inc);
  const base = Math.max(inc, fix+vr+sv) || 1;
  const parts = [["s-fix",fix],["s-var",vr],["s-save",sv]]; if(rest>0) parts.push(["s-rest",rest]);
  document.getElementById("strip").innerHTML = parts.map(([c,x])=>`<div class="${c}" style="width:${x/base*100}%"></div>`).join("");
}
function refreshLive(){
  renderTop();
  const s = document.getElementById("secSum"); if(s) s.textContent = chf(sum(tab));
  if(tab!=="income"&&tab!=="eval"){ const inc=sum("income"); data[tab].forEach(i=>{ const e=document.getElementById("p-"+i.id); if(e) e.textContent=pct(Number(i.amount)||0,inc); }); }
}

// ---------- Monatsauswahl ----------
function renderSheet(){
  document.getElementById("yLabel").textContent = pickYear;
  const today = todayKey();
  document.getElementById("months").innerHTML = Array.from({length:12},(_,m)=>{
    const k = keyOf(pickYear,m), cls = ["m"];
    if(k===today) cls.push("today"); if(k===current) cls.push("sel"); if(store.months[k]) cls.push("saved");
    return `<button class="${cls.join(" ")}" data-month="${k}" aria-label="${labelOf(k)}${store.months[k]?", gesichert":""}">${shortMonth(m)}</button>`;
  }).join("");
}
function openSheet(){ pickYear = parseKey(current).y; renderSheet(); document.getElementById("sheetBg").classList.add("open"); }
function closeSheet(){ document.getElementById("sheetBg").classList.remove("open"); }

// ---------- Teilen ----------
const MARK = "BUDGET-CHF:";
const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = t => JSON.parse(decodeURIComponent(escape(atob(t))));

function shareBudget(keys){
  const months = {}; keys.forEach(k => months[k] = store.months[k]);
  const lines = keys.sort().map(k => { const t = totalsOf(months[k]); return `${labelOf(k)}: Einnahmen ${chf(t.inc)}, Rest ${chf(t.rest)}`; });
  const text = `Budget CHF\n${lines.join("\n")}\n\nZum Übernehmen diese Nachricht kopieren und im Budgetplaner unter «Auswertung» auf «Budget empfangen» tippen.\n\n${MARK}${enc({v:2, months})}`;
  document.getElementById("sendBg").classList.remove("open");
  if(navigator.share){
    navigator.share({text}).catch(err => { if(err && err.name!=="AbortError") copyFallback(text); });
  } else copyFallback(text);
}
function copyFallback(text){
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .then(()=>toast("Budget kopiert. Füge es in eine Nachricht ein.", 2400))
    .catch(()=>prompt("Kopiere diesen Text und sende ihn:", text));
}

function parseBudget(txt){
  if(!txt) return null;
  const i = txt.indexOf(MARK);
  try{
    if(i>=0){ const d = dec(txt.slice(i+MARK.length).trim().split(/\s/)[0]); return d && d.months ? d.months : null; }
    const d = JSON.parse(txt);                // ältere Sicherungen
    if(d && d.months) return d.months;
    if(valid(d)) return {[current]: d};
  }catch(e){}
  return null;
}
async function receiveBudget(){
  let txt = "";
  try{ if(navigator.clipboard && navigator.clipboard.readText) txt = await navigator.clipboard.readText(); }catch(e){}
  let months = parseBudget(txt);
  if(!months){
    txt = prompt("Füge hier die erhaltene Nachricht ein:");
    if(!txt) return;
    months = parseBudget(txt);
  }
  const keys = Object.keys(months||{}).filter(k => /^\d{4}-\d{2}$/.test(k) && valid(months[k])).sort();
  if(!keys.length){ toast("In diesem Text ist kein Budget enthalten", 2400); return; }
  const list = keys.map(k => `• ${labelOf(k)}${store.months[k] ? " (ersetzt deine Werte)" : ""}`).join("\n");
  if(!confirm(`Dieses Budget übernehmen?\n\n${list}`)) return;
  keys.forEach(k => store.months[k] = months[k]);
  writeStore(); clearDraft();
  openMonth(keys.includes(current) ? current : keys[keys.length-1]);
  toast(keys.length===1 ? labelOf(keys[0]) + " übernommen" : keys.length + " Monate übernommen");
}

// ---------- Ereignisse ----------
document.getElementById("sendOne").onclick = () => shareBudget([current]);
document.getElementById("sendAll").onclick = () => shareBudget(Object.keys(store.months));
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => document.getElementById(b.dataset.close).classList.remove("open"));
document.getElementById("sendBg").addEventListener("click", e => { if(e.target.id==="sendBg") e.target.classList.remove("open"); });
document.getElementById("cal").onclick = openSheet;
document.getElementById("saveBtn").onclick = () => { if(dirty) saveMonth(); else toast(labelOf(current) + " ist bereits gesichert"); };
document.getElementById("sheetClose").onclick = closeSheet;
document.getElementById("sheetBg").addEventListener("click", e => { if(e.target.id==="sheetBg") closeSheet(); });
document.getElementById("yPrev").onclick = () => { pickYear--; renderSheet(); };
document.getElementById("yNext").onclick = () => { pickYear++; renderSheet(); };
document.getElementById("toToday").onclick = () => switchMonth(todayKey());
document.getElementById("months").addEventListener("click", e => { const b=e.target.closest("[data-month]"); if(b) switchMonth(b.dataset.month); });
document.addEventListener("keydown", e => { if(e.key==="Escape") closeSheet(); });

document.getElementById("nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if(!b) return;
  tab = b.dataset.tab; renderNav(); renderView(); window.scrollTo({top:0});
});
const view = document.getElementById("view");
view.addEventListener("input", e => {
  const it = e.target.closest(".item"); if(!it) return;
  const item = data[tab].find(i=>i.id==it.dataset.id);
  if(e.target.dataset.f==="amount") item.amount = parse(e.target.value); else item.name = e.target.value;
  refreshLive(); markDirty();
});
view.addEventListener("focusin", e => { if(e.target.classList.contains("amt")) e.target.select(); });
view.addEventListener("click", e => {
  const h = e.target.closest(".hist"); if(h){ switchMonth(h.dataset.month); return; }
  const id = e.target.id;
  if(e.target.classList.contains("del")){
    const iid = e.target.closest(".item").dataset.id;
    data[tab] = data[tab].filter(i=>i.id!=iid); renderView(); renderTop(); markDirty();
  } else if(id==="add"){
    data[tab].push({id:++uid,name:"Neue Position",amount:0}); renderView(); renderTop(); markDirty();
    const names = view.querySelectorAll(".name"); const n = names[names.length-1]; n.focus(); n.select();
  } else if(id==="prev"){
    const pk = prevSaved(current);
    if(!pk){ toast("Kein gesicherter Monat vor " + labelOf(current)); return; }
    data = clone(store.months[pk]); fixUid(); renderView(); renderTop(); markDirty();
    toast("Werte von " + labelOf(pk) + " übernommen");
  } else if(id==="clear"){
    SECTIONS.forEach(k=>data[k].forEach(i=>i.amount=0)); renderView(); renderTop(); markDirty();
  } else if(id==="send"){
    if(dirty){ if(confirm("Änderungen für " + labelOf(current) + " zuerst sichern?")) saveMonth(); }
    const n = Object.keys(store.months).length;
    if(!store.months[current] && n===0){ toast("Sichere zuerst einen Monat"); return; }
    document.getElementById("sendOne").innerHTML = `Nur ${labelOf(current)}<small>Für das aktuelle Budget</small>`;
    document.getElementById("sendOne").disabled = !store.months[current];
    document.getElementById("sendAll").innerHTML = `Alle Monate (${n})<small>Mit Verlauf, auch als Sicherung</small>`;
    document.getElementById("sendBg").classList.add("open");
  } else if(id==="receive"){
    receiveBudget();
  }
});

// Start
try{
  const hadDraft = load();
  renderNav();
  if(hadDraft){ updateSaveBtn(); renderView(); renderTop(); toast("Nicht gesicherte Änderungen wiederhergestellt"); }
  else openMonth(todayKey());
}catch(e){ document.getElementById("view").textContent = "Fehler beim Starten: " + e.message; }
</script>
</body>
</html>
